
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Соотношение</title>

<style>
    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        padding:20px;
        background:#f4f6f9;
        font-family:Segoe UI, sans-serif;
        color:#222;
    }

    .container{
        max-width:520px;
        margin:auto;
    }

    .card{
        background:white;
        border-radius:14px;
        padding:20px;
        margin-bottom:16px;
        box-shadow:0 4px 14px rgba(0,0,0,0.08);
    }

    h1{
        margin-top:0;
        font-size:28px;
        text-align:center;
    }

    h2{
        margin-top:0;
        font-size:18px;
    }

    .row{
        margin-bottom:14px;
    }

    label{
        display:block;
        margin-bottom:6px;
        font-size:14px;
        font-weight:600;
    }

    input,
    select,
    textarea,
    button{
        width:100%;
        padding:10px 12px;
        border-radius:10px;
        border:1px solid #cfcfcf;
        font-size:15px;
    }

    textarea{
        resize:vertical;
        min-height:70px;
        font-family:Consolas, monospace;
    }

    button{
        background:#1a7f37;
        color:white;
        border:none;
        cursor:pointer;
        font-weight:600;
        transition:0.2s;
    }

    button:hover{
        background:#14662c;
    }

    .result{
        text-align:center;
        font-size:36px;
        font-weight:bold;
        color:#1a7f37;
        margin-top:10px;
    }

    .details{
        text-align:center;
        color:#666;
        font-size:13px;
        margin-top:10px;
        word-break:break-word;
    }

    .base-controls{
        display:flex;
        gap:10px;
    }

    .base-controls select{
        flex:1;
    }

    .editor{
        display:grid;
        gap:10px;
    }

    .base-list{
        max-height:220px;
        overflow:auto;
        border:1px solid #ddd;
        border-radius:10px;
        padding:8px;
    }

    .base-item{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px;
        border-bottom:1px solid #eee;
    }

    .base-item:last-child{
        border-bottom:none;
    }

    .mini-buttons{
        display:flex;
        gap:5px;
    }

    .mini-buttons button{
        width:auto;
        padding:6px 10px;
        font-size:12px;
    }

    .danger{
        background:#c62828;
    }

    .danger:hover{
        background:#9f1f1f;
    }
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h1>Соотношение</h1>

        <div class="row">
            <label>Значение A (1-100)</label>
            <select id="valueA"></select>
        </div>

        <div class="row">
            <label>Значение B</label>
            <input type="number" id="valueB" step="0.01" value="2.4">
        </div>

        <div class="row">
            <label>Значение D</label>
            <input type="number" id="valueD" step="0.01" value="145">
        </div>

        <div class="row">
            <label>Выбор базы (C)</label>

            <div class="base-controls">
                <select id="baseSelect"></select>
                <input type="text" id="valueC" readonly>
            </div>
        </div>

        <div class="row">
            <button onclick="toggleEditor()">⚙ РЕДАКТОР БАЗЫ</button>
        </div>
    </div>

    <div class="card">
        <h2>Формула</h2>

        <textarea id="formula">
(({A} * {B} + {C}) / {D}) * 100 - 100
        </textarea>
    </div>

    <div class="card">
        <div class="details" id="details">
            Введите данные...
        </div>

        <div class="result" id="result">
            0.00 %
        </div>
    </div>

    <div class="card" id="editorBlock" style="display:none;">
        <h2>Редактор справочника C</h2>

        <div class="editor">

            <input type="text" id="newBaseName" placeholder="Название">
            <input type="number" id="newBaseValue" placeholder="Значение">

            <button onclick="addBase()">Добавить</button>

            <div class="base-list" id="baseList"></div>

        </div>
    </div>

</div>

<script>

const DEFAULT_BASES = {
    "6 ЛЕРУА": 8.64,
    "8 ЛЕРУА": 10.56,
    "10 ЛЕРУА": 12.48,
    "12 ЛЕРУА": 9.36,
    "8 HARD": 5.76,
    "10 HARD": 6.72,
    "8 ГОСТ": 9.96,
    "10 ГОСТ": 8.16,
    "6 ST": 7.68,
    "8 ST": 9.6,
    "10 ST": 11.52,
    "12 ST": 12.96,
    "4 PRO": 3.84,
    "6 PRO": 8.64,
    "8 PRO": 10.56,
    "10 PRO": 12.48,
    "12 PRO": 12.96,
    "14 PRO": 10.56,
    "16 PRO": 10.8
};

let BASES = JSON.parse(localStorage.getItem("calcapp_bases")) || DEFAULT_BASES;

const valueA = document.getElementById("valueA");
const valueB = document.getElementById("valueB");
const valueC = document.getElementById("valueC");
const valueD = document.getElementById("valueD");

const formula = document.getElementById("formula");
const result = document.getElementById("result");
const details = document.getElementById("details");

const baseSelect = document.getElementById("baseSelect");
const baseList = document.getElementById("baseList");

function initA(){
    for(let i=1;i<=100;i++){
        const option = document.createElement("option");
        option.value = i;
        option.textContent = i;
        valueA.appendChild(option);
    }

    valueA.value = 46;
}

function saveBases(){
    localStorage.setItem("calcapp_bases", JSON.stringify(BASES));
}

function renderBases(){

    baseSelect.innerHTML = "";

    Object.keys(BASES).forEach(key => {

        const option = document.createElement("option");
        option.value = key;
        option.textContent = key;

        baseSelect.appendChild(option);

    });

    renderBaseList();

    if(baseSelect.value === ""){
        baseSelect.selectedIndex = 0;
    }

    updateC();
}

function renderBaseList(){

    baseList.innerHTML = "";

    Object.entries(BASES).forEach(([name,val]) => {

        const div = document.createElement("div");
        div.className = "base-item";

        div.innerHTML = `
            <div>
                <strong>${name}</strong><br>
                <small>${val}</small>
            </div>

            <div class="mini-buttons">
                <button onclick="editBase('${name}')">Изм.</button>
                <button class="danger" onclick="deleteBase('${name}')">Удалить</button>
            </div>
        `;

        baseList.appendChild(div);

    });

}

function updateC(){

    const selected = baseSelect.value;

    if(BASES[selected] !== undefined){
        valueC.value = BASES[selected];
    } else {
        valueC.value = "";
    }

    calculate();
}

function calculate(){

    try{

        let expr = formula.value;

        const values = {
            A: valueA.value || 0,
            B: valueB.value || 0,
            C: valueC.value || 0,
            D: valueD.value || 1
        };

        Object.entries(values).forEach(([k,v])=>{
            expr = expr.replaceAll(`{${k}}`, v);
        });

        const clean = expr.replace(/\s/g,'');

        if(!/^[0-9.+\-*/()]+$/.test(clean)){
            result.textContent = "Ошибка";
            return;
        }

        const calc = Function(`return ${clean}`)();

        result.textContent = calc.toFixed(2) + " %";
        details.textContent = "Формула: " + expr;

    } catch(e){

        result.textContent = "---";

    }

}

function addBase(){

    const name = document.getElementById("newBaseName").value.trim();
    const val = parseFloat(document.getElementById("newBaseValue").value);

    if(!name){
        alert("Введите название");
        return;
    }

    if(isNaN(val)){
        alert("Введите значение");
        return;
    }

    if(BASES[name]){
        alert("Такое имя уже существует");
        return;
    }

    BASES[name] = val;

    saveBases();
    renderBases();

    document.getElementById("newBaseName").value = "";
    document.getElementById("newBaseValue").value = "";

}

function editBase(name){

    const val = prompt("Новое значение:", BASES[name]);

    if(val === null) return;

    const num = parseFloat(val);

    if(isNaN(num)){
        alert("Неверное число");
        return;
    }

    BASES[name] = num;

    saveBases();
    renderBases();

}

function deleteBase(name){

    if(!confirm(`Удалить '${name}' ?`)){
        return;
    }

    delete BASES[name];

    saveBases();
    renderBases();

}

function toggleEditor(){

    const block = document.getElementById("editorBlock");

    if(block.style.display === "none"){
        block.style.display = "block";
    } else {
        block.style.display = "none";
    }

}

valueA.addEventListener("input", calculate);
valueB.addEventListener("input", calculate);
valueD.addEventListener("input", calculate);
formula.addEventListener("input", calculate);
baseSelect.addEventListener("change", updateC);

initA();
renderBases();
calculate();

</script>

</body>
</html>
```
